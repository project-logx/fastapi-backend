name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "fastapi-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "fastapi-backend/**"
      - ".github/workflows/backend-ci.yml"
      - "docker-compose.yml"

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: fastapi-backend/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Import FastAPI app
        env:
          DATABASE_URL: sqlite:///./ci-logx.db
          ATTACHMENTS_DIR: ./storage/attachments
          ALLOWED_ORIGINS: "*"
          SECRET_KEY: ci-secret
          EMBEDDING_PROVIDER: deterministic
        run: python -c "from app.main import app; print(app.title)"

      - name: Run tests when present
        env:
          DATABASE_URL: sqlite:///./ci-logx.db
          ATTACHMENTS_DIR: ./storage/attachments
          ALLOWED_ORIGINS: "*"
          SECRET_KEY: ci-secret
          EMBEDDING_PROVIDER: deterministic
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest
          else
            echo "No backend tests found; import check passed."
          fi

  docker:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t logx-backend:ci ./fastapi-backend
