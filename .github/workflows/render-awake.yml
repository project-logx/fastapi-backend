name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            https://logx-backend-latest.onrender.com/api/v1/health